<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>永久雇用カフェ</title>
  <meta name="description" content="お客さんをスカウトして、永久雇用契約で正社員にするカフェ経営ゲーム">
  <meta name="theme-color" content="#3b0d9e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="永久雇用カフェ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="title">☕ 永久雇用カフェ <small id="rankName" class="rank-chip"></small></div>
      <div class="stats">
        <div class="stat" title="所持金">💰 <b id="money">0</b></div>
        <div class="stat level" title="レベル">
          <span>⭐ Lv<b id="level">1</b></span>
          <div class="xpbar"><i id="xpbar"></i></div>
        </div>
        <div class="stat" title="永久雇用契約">📜 <b id="contracts">0</b></div>
        <div class="stat" title="人気度">💖 <b id="pop">0</b></div>
      </div>
    </header>

    <main id="screens">
      <!-- カフェ画面（お店の様子だけを画面いっぱいに表示） -->
      <section id="scr-cafe" class="screen active">
        <div id="floor">
          <div class="wall">
            <div class="window w1"></div>
            <div class="board" id="board"></div>
            <div class="window w2"></div>
          </div>
          <div id="wallDecor"></div>
          <div id="counter" class="counter"></div>
          <div id="miniStoves" class="mini-stoves"></div>
          <div id="floorDecor"></div>
          <div class="door"><span class="open-sign">OPEN</span></div>
          <div class="log-window">
            <div class="log-title">📢 お店のできごと <span>お客さんをタップでスカウト</span></div>
            <div id="log" class="log"></div>
          </div>
        </div>
      </section>

      <!-- 厨房画面（メニュー画面：調理・スタッフ・ショップ） -->
      <section id="scr-kitchen" class="screen">
        <div class="scroll">
          <nav class="seg">
            <button class="seg-btn active" data-action="ktab" data-ktab="cook">🍳 調理<b class="dot" id="cookDot" hidden></b></button>
            <button class="seg-btn" data-action="ktab" data-ktab="staff">👥 スタッフ</button>
            <button class="seg-btn" data-action="ktab" data-ktab="shop">🛒 ショップ</button>
          </nav>
          <div id="kitchen"></div>
        </div>
      </section>

      <!-- 街画面（引き抜き作戦） -->
      <section id="scr-town" class="screen">
        <div class="scroll" id="town"></div>
        <div id="spyView" class="spy-view" hidden></div>
      </section>

      <!-- 設定画面 -->
      <section id="scr-settings" class="screen">
        <div class="scroll" id="settings"></div>
      </section>
    </main>

    <nav id="bottomNav">
      <button class="nav-btn active" data-action="screen" data-screen="cafe"><i>☕</i><span>カフェ</span></button>
      <button class="nav-btn" data-action="screen" data-screen="kitchen"><i>🍳</i><span>厨房</span><b class="dot" id="kitchenDot" hidden></b></button>
      <button class="nav-btn" data-action="screen" data-screen="town"><i>🗺️</i><span>街</span></button>
      <button class="nav-btn" data-action="screen" data-screen="settings"><i>⚙️</i><span>設定</span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toasts"></div>

  <script src="chara.js"></script>
  <script src="stand.js"></script>
  <script src="game.js"></script>
  <script src="town.js"></script>
</body>
</html>
