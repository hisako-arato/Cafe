<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>永久雇用カフェ</title>
  <meta name="description" content="お客さんをスカウトして、永久雇用契約で正社員にするカフェ経営ゲーム">
  <meta name="theme-color" content="#3b0d9e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="永久雇用カフェ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="title">☕ 永久雇用カフェ</div>
      <div class="stats">
        <div class="stat" title="所持金">💰 <b id="money">0</b></div>
        <div class="stat level" title="レベル">
          <span>⭐ Lv<b id="level">1</b></span>
          <div class="xpbar"><i id="xpbar"></i></div>
        </div>
        <div class="stat" title="永久雇用契約">📜 <b id="contracts">0</b></div>
        <div class="stat" title="人気度">💖 <b id="pop">0</b></div>
        <button class="help" data-action="help" aria-label="遊び方">？</button>
      </div>
    </header>

    <main id="main">
      <section id="floorWrap">
        <div id="floor">
          <div id="counter" class="counter"></div>
          <div id="miniStoves" class="mini-stoves"></div>
          <div id="door" class="door">🚪</div>
          <div id="decorRow" class="decor-row"></div>
        </div>
        <p class="hint">お客さんをタップするとスカウトできます</p>
      </section>

      <section id="panel">
        <nav class="tabs">
          <button class="tab active" data-action="tab" data-tab="kitchen">🍳 キッチン</button>
          <button class="tab" data-action="tab" data-tab="staff">👥 スタッフ</button>
          <button class="tab" data-action="tab" data-tab="shop">🛒 ショップ</button>
        </nav>
        <div id="kitchen" class="pane"></div>
        <div id="staff" class="pane" hidden></div>
        <div id="shop" class="pane" hidden></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toasts"></div>

  <script src="chara.js"></script>
  <script src="game.js"></script>
</body>
</html>
