<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>永久雇用カフェ</title>
  <meta name="description" content="お客さんをスカウトして、永久雇用契約で正社員にするカフェ経営ゲーム">
  <meta name="theme-color" content="#3b0d9e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="永久雇用カフェ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="title">☕ 永久雇用カフェ</div>
      <div class="stats">
        <div class="stat" title="所持金">💰 <b id="money">0</b></div>
        <div class="stat level" title="レベル">
          <span>⭐ Lv<b id="level">1</b></span>
          <div class="xpbar"><i id="xpbar"></i></div>
        </div>
        <div class="stat" title="永久雇用契約">📜 <b id="contracts">0</b></div>
        <div class="stat" title="人気度">💖 <b id="pop">0</b></div>
      </div>
    </header>

    <main id="screens">
      <!-- カフェ画面 -->
      <section id="scr-cafe" class="screen active">
        <div class="floor-box">
          <div id="floor">
            <div id="counter" class="counter"></div>
            <div id="miniStoves" class="mini-stoves"></div>
            <div id="door" class="door">🚪</div>
            <div id="decorRow" class="decor-row"></div>
          </div>
        </div>
        <div class="cafe-bar">
          <button class="pill-btn" data-action="sheet" data-sheet="staff">👥 スタッフ <b id="staffCount"></b></button>
          <button class="pill-btn" data-action="sheet" data-sheet="shop">🛒 ショップ</button>
        </div>
        <div class="log-window">
          <div class="log-title">📢 お店のできごと <span>お客さんをタップするとスカウトできます</span></div>
          <div id="log" class="log"></div>
        </div>
      </section>

      <!-- 厨房画面 -->
      <section id="scr-kitchen" class="screen">
        <div class="scroll" id="kitchen"></div>
      </section>

      <!-- 設定画面 -->
      <section id="scr-settings" class="screen">
        <div class="scroll" id="settings"></div>
      </section>
    </main>

    <nav id="bottomNav">
      <button class="nav-btn active" data-action="screen" data-screen="cafe"><i>☕</i><span>カフェ</span></button>
      <button class="nav-btn" data-action="screen" data-screen="kitchen"><i>🍳</i><span>厨房</span><b class="dot" id="kitchenDot" hidden></b></button>
      <button class="nav-btn" data-action="screen" data-screen="settings"><i>⚙️</i><span>設定</span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toasts"></div>

  <script src="chara.js"></script>
  <script src="game.js"></script>
</body>
</html>
