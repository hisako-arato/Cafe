<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>永久雇用カフェ</title>
  <meta name="description" content="お客さんをスカウトして、永久雇用契約で正社員にするカフェ経営ゲーム">
  <meta name="theme-color" content="#3b0d9e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="永久雇用カフェ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="title">☕ 永久雇用カフェ <button id="rankName" class="rank-chip" data-action="gotoRank" aria-label="店舗ランクを見る"></button></div>
      <div class="stats">
        <div class="stat" title="所持金">💰 <b id="money">0</b></div>
        <div class="stat level" title="レベル">
          <span>⭐ Lv<b id="level">1</b></span>
          <div class="xpbar"><i id="xpbar"></i></div>
        </div>
        <div class="stat" title="正社員の枠（正社員の人数／枠）">📜 <b id="contracts">0</b></div>
        <div class="stat" title="人気度">💖 <b id="pop">0</b></div>
      </div>
    </header>

    <main id="screens">
      <!-- カフェ画面（お店の様子だけを画面いっぱいに表示） -->
      <section id="scr-cafe" class="screen active">
        <div id="floor">
          <div class="wall">
            <div class="window w1"></div>
            <div class="board" id="board"></div>
            <div class="window w2"></div>
          </div>
          <button id="restDoor" class="rest-door" data-action="restRoom" aria-label="休憩室"></button>
          <div class="kitchen-floor"><span class="zone-label">🍳 厨房</span></div>
          <div id="wallDecor"></div>
          <div id="counter" class="counter"></div>
          <div id="staffGate" class="staff-gate"><i></i><i></i><b>STAFF</b></div>
          <div class="counter-end"></div>
          <div id="floorDecor"></div>
          <div class="door"><span class="open-sign">OPEN</span></div>
          <button id="editBtn" class="edit-btn" data-action="editLayout">🛠 配置</button>
          <div id="editBar" class="edit-bar" hidden>
            <span>🛠 配置を編集中：テーブル・コンロ・観葉植物などをドラッグ</span>
            <button class="btn ghost small" data-action="layoutReset">↺ 最初の配置</button>
            <button class="btn small" data-action="editDone">✓ 完了</button>
          </div>
          <div class="log-window">
            <div class="log-title">📢 お店のできごと <span>お客さんをタップでスカウト</span></div>
            <div id="log" class="log"></div>
          </div>
        </div>
      </section>

      <!-- お店画面（調理・スタッフ・ショップ・店舗ランク） -->
      <section id="scr-kitchen" class="screen">
        <div class="scroll">
          <nav class="seg">
            <button class="seg-btn active" data-action="ktab" data-ktab="cook">🍳 調理<b class="dot" id="cookDot" hidden></b></button>
            <button class="seg-btn" data-action="ktab" data-ktab="staff">👥 スタッフ</button>
            <button class="seg-btn" data-action="ktab" data-ktab="shop">🛒 ショップ</button>
            <button class="seg-btn" data-action="ktab" data-ktab="rank">🏆 ランク<b class="dot" id="rankDot" hidden></b></button>
          </nav>
          <div id="kitchen"></div>
        </div>
      </section>

      <!-- 街画面（引き抜き作戦） -->
      <section id="scr-town" class="screen">
        <div class="scroll" id="town"></div>
        <div id="spyView" class="spy-view" hidden></div>
      </section>

      <!-- 店長画面（ステータス・身支度・記録・設定） -->
      <section id="scr-owner" class="screen">
        <div class="scroll" id="owner"></div>
      </section>
    </main>

    <nav id="bottomNav">
      <button class="nav-btn active" data-action="screen" data-screen="cafe"><i>☕</i><span>カフェ</span></button>
      <button class="nav-btn" data-action="screen" data-screen="kitchen"><i>🏪</i><span>お店</span><b class="dot" id="kitchenDot" hidden></b></button>
      <button class="nav-btn" data-action="screen" data-screen="owner"><i>👩‍🍳</i><span>店長</span></button>
      <button class="nav-btn" data-action="screen" data-screen="town"><i>🗺️</i><span>街</span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toasts"></div>

  <script src="chara.js"></script>
  <script src="stand.js"></script>
  <script src="game.js"></script>
  <script src="town.js"></script>
</body>
</html>
